name: Publish checksums and sync the website

# Fires once a human publishes a draft release (desktop-release.yml in the
# NEURAX repo always creates one as a draft — see that workflow for why).
# Nothing here runs on a draft, so a build nobody has reviewed yet can never
# reach neuraxs.dev.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir assets

      - name: Generate SHA256SUMS.txt
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          mv SHA256SUMS.txt ..

      # Re-running this workflow (a manual re-dispatch, or GitHub redelivering
      # the webhook) must not fail on "asset already exists" — clobber wins.
      - name: Upload SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

  sync-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout neurax-website
        uses: actions/checkout@v4
        with:
          repository: NEURAX-canvas/neurax-website
          # A fine-grained PAT scoped to neurax-website (Contents: read/write).
          # The default GITHUB_TOKEN here only has permission inside
          # neurax-releases, not across into a different repo.
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate data/downloads.json from this release
        run: node scripts/sync-release.mjs < "$GITHUB_EVENT_PATH"

      - name: Commit and push if it changed
        run: |
          git config user.name "neurax-releases-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/downloads.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(downloads): sync ${{ github.event.release.tag_name }} from neurax-releases"
          git push
